<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>由团长岳浩宇提供支持</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #f5f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 340px;
            background: #ffffff;
            border-radius: 18px;
            padding: 36px 22px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
        }
        h2 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }
        .qrcode {
            width: 210px;
            height: 210px;
            border-radius: 12px;
            margin: 0 auto 24px;
        }
        .tips {
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>欢迎新成员加入盛航无人机社团</h2>
        <p class="subtitle">🥳长按二维码入群🥳</p>
        <!-- 已填入你提供的图床二维码链接 -->
        <img class="qrcode" src="https://free.boltp.com/2026/09/07/6a9e5df0d666b.webp" alt="社群二维码">
        <p class="tips">长按⬆️⬆️⬆️二维码加入群聊</p>
    </div>
</body>
</html>
